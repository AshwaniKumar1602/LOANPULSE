{% extends 'base.html' %}
{% block title %}429 — Rate Limit Exceeded | LoanPulse{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
  <div class="w-16 h-16 rounded-2xl bg-amber-100 dark:bg-amber-950/60 border border-amber-300 dark:border-amber-700 flex items-center justify-center text-amber-600 dark:text-amber-400 text-2xl font-bold mb-4 shadow-sm">
    <i class="fa-solid fa-gauge-high"></i>
  </div>
  <h1 class="text-4xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight sm:text-5xl">429</h1>
  <p class="mt-2 text-lg font-semibold text-amber-600 dark:text-amber-500">Too Many Requests</p>
  <p class="mt-3 text-sm text-slate-600 dark:text-slate-400 max-w-md">
    You have exceeded the allowed request frequency for this endpoint (Security Rule #6). Please wait a moment before trying again.
  </p>
  <div class="mt-6 flex space-x-4">
    <a href="{{ url_for('main.index') }}" class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm transition-colors">
      <i class="fa-solid fa-house mr-1.5"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
