{% extends 'base.html' %}
{% block title %}500 — Internal Error | LoanPulse{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
  <div class="w-16 h-16 rounded-2xl bg-rose-100 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-700 flex items-center justify-center text-rose-600 dark:text-rose-400 text-2xl font-bold mb-4 shadow-sm">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </div>
  <h1 class="text-4xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight sm:text-5xl">500</h1>
  <p class="mt-2 text-lg font-semibold text-rose-600 dark:text-rose-400">Internal Server Error</p>
  <p class="mt-3 text-sm text-slate-600 dark:text-slate-400 max-w-md">
    An unexpected error occurred while processing your request. The transaction has been rolled back safely.
  </p>
  <div class="mt-6 flex space-x-4">
    <a href="{{ url_for('main.index') }}" class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm transition-colors">
      <i class="fa-solid fa-house mr-1.5"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
