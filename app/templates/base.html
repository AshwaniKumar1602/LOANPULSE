<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LoanPulse — LoanMaster Loan Management{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Yellowish-Goldenish Theme Palette Tokens
            gold: {
              50: '#FFFBEB',
              100: '#FEF3C7',
              200: '#FDE68A',
              300: '#FCD34D',
              400: '#FBBF24',
              500: '#F59E0B', // Primary Warm Accent
              600: '#D97706', // Primary Warm Amber
              700: '#B45309', // Deep Warm Amber
              800: '#92400E', // Deep Warm Gold
              900: '#78350F',
              950: '#451A03',
            },
            amber: {
              50: '#FFFBEB',
              100: '#FEF3C7',
              200: '#FDE68A',
              300: '#FCD34D',
              400: '#FBBF24',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309',
              800: '#92400E',
              900: '#78350F',
              950: '#451A03',
            },
            surface: {
              light: '#FAFAF9',       // Clean warm off-white
              lightWarm: '#FFFBEB',   // Subtle amber wash
              lightCard: '#FFFFFF',
              dark: '#0F172A',        // Rich slate-900
              darkCard: '#1E293B',    // Rich charcoal/slate-800
              darkElevated: '#334155' // Slate-700
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Accessibility & Theme CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col bg-[#FAFAF9] dark:bg-[#0F172A] text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 transition-colors">
  
  <!-- Navigation Bar -->
  {% include 'components/navbar.html' %}

  <!-- Flash Alerts -->
  {% include 'components/alerts.html' %}

  <!-- Main Content Container with Responsive Padding -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include 'components/footer.html' %}

  <!-- Core Javascript -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
