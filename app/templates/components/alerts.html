{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="fixed top-20 right-5 z-50 max-w-md w-full space-y-3 pointer-events-none">
      {% for category, message in messages %}
        <div class="flash-alert pointer-events-auto flex items-start p-4 rounded-xl shadow-lg border backdrop-blur-md transition-all duration-300
          {% if category == 'success' %}
            bg-emerald-50/95 dark:bg-emerald-950/90 text-emerald-900 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700
          {% elif category == 'danger' %}
            bg-rose-50/95 dark:bg-rose-950/90 text-rose-900 dark:text-rose-100 border-rose-300 dark:border-rose-700
          {% elif category == 'warning' %}
            bg-amber-50/95 dark:bg-amber-950/90 text-amber-950 dark:text-amber-100 border-amber-300 dark:border-amber-700
          {% else %}
            bg-blue-50/95 dark:bg-blue-950/90 text-blue-900 dark:text-blue-100 border-blue-300 dark:border-blue-700
          {% endif %}">
          <div class="flex-shrink-0 mr-3 text-lg">
            {% if category == 'success' %}
              <i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>
            {% elif category == 'danger' %}
              <i class="fa-solid fa-circle-exclamation text-rose-600 dark:text-rose-400"></i>
            {% elif category == 'warning' %}
              <i class="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400"></i>
            {% else %}
              <i class="fa-solid fa-circle-info text-blue-600 dark:text-blue-400"></i>
            {% endif %}
          </div>
          <div class="flex-1 text-sm font-medium leading-relaxed">
            {{ message }}
          </div>
          <button type="button" onclick="this.parentElement.remove()" class="ml-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
