name: Keep Render Alive

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows you to run it manually from the Actions tab to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep service awake
        run: |
          curl -s https://loanpulse-dkc4.onrender.com > /dev/null
          echo "Pinged Render successfully!"
